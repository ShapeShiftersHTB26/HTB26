# Full local stack:  docker compose up --build
#   UI        http://localhost:5173
#   API       http://localhost:8080   (admin header: x-admin-key: dev-admin-key)
#   RPC       http://localhost:8899   (websocket :8900)
#   Postgres  localhost:5433          (pm / pm)
# Reset chain + database + keys together:  docker compose down -v
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: pm, POSTGRES_PASSWORD: pm, POSTGRES_DB: pm }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 2s
      timeout: 3s
      retries: 30

  validator:
    build: { context: ., dockerfile: docker/validator.Dockerfile }
    platform: linux/amd64
    ports: ["8899:8899", "8900:8900"]
    volumes: [ledger:/ledger]
    healthcheck:
      test: ["CMD-SHELL", "solana cluster-version -u http://$$(hostname -i | awk '{print $$1}'):8899"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    depends_on:
      db: { condition: service_healthy }
      validator: { condition: service_healthy }
    ports: ["8080:8080"]
    volumes: [keys:/keys]
    environment:
      RPC_URL: http://validator:8899
      PUBLIC_RPC_URL: http://localhost:8899        # what browsers use
      DATABASE_URL: postgres://pm:pm@db:5432/pm
      AUTO_CREATE_KEYS: "true"                     # admin + mUSDC mint keypairs generated on first start
      ADMIN_KEYPAIR: /keys/admin.json
      MUSDC_MINT_KEYPAIR: /keys/musdc-mint.json
      BOT_KEYS_DIR: /keys/bots
      BOOTSTRAP_ON_START: "true"                   # airdrop admin, create mUSDC mint, init program Config
      DEMO_MARKETS: "true"                         # create 2 demo markets if the db is empty
      ADMIN_API_KEY: dev-admin-key
      BOT_COUNT: "5"
      BOT_INTERVAL_MS: "3000"
      BOTS_AUTOSTART: "true"
      FAUCET_SOL_LAMPORTS: "50000000"
      RUST_LOG: pm_backend=info,tower_http=warn
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args: { VITE_API_URL: "http://localhost:8080" }
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  pgdata:
  ledger:
  keys:
