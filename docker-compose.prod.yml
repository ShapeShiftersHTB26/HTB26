# Prod override: hosted Postgres + Solana devnet for the prediction market (instead of the local
# prediction-market-db and prediction-market-validator), and Backtrace locked down for a public server:
# only the web port is published, behind ACCESS_CODE; the api, Memgraph and Lab stay inside the docker network.
#
#   cp prediction-market/.env.prod.example prediction-market/.env.prod    # fill it in
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# One-time devnet setup (fund the admin, deploy the program): prediction-market/README.md, "Production".
services:
  prediction-market-db:
    profiles: [local-chain]        # not started: DATABASE_URL points at the hosted Postgres
  prediction-market-validator:
    profiles: [local-chain]        # not started: RPC_URL points at devnet

  prediction-market-backend:
    depends_on: !reset []
    env_file: prediction-market/.env.prod   # DATABASE_URL, RPC_URL, ADMIN_API_KEY, optional tuning
    environment: !override
      ADMIN_KEYPAIR: /keys/admin.json
      MUSDC_MINT_KEYPAIR: /keys/musdc-mint.json
      BOT_KEYS_DIR: /keys/bots
      BOOTSTRAP_ON_START: "true"   # idempotent: creates the mUSDC mint + program Config if missing
    volumes: !override
      - ./prediction-market/keys:/keys   # admin.json + musdc-mint.json (scripts/setup.sh writes them)

  web:
    environment:
      ACCESS_CODE: ${ACCESS_CODE:?set ACCESS_CODE in .env - the code visitors enter to open the site}

  lab:
    profiles: [tools]              # not started (an open database console); --profile tools to run it

  api:
    ports: !reset []               # reachable only through the web server (/api proxy, behind ACCESS_CODE)
    environment:
      ACCESS_CODE: ${ACCESS_CODE:?set ACCESS_CODE in .env - the code visitors enter to open the site}
      # the api opens + settles data-settled markets through the backend's admin endpoints
      PM_ADMIN_KEY: ${PM_ADMIN_KEY:?set PM_ADMIN_KEY in .env to ADMIN_API_KEY from prediction-market/.env.prod}
